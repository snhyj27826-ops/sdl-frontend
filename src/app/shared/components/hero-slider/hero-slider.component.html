<swiper-container
  #swiper
  init="false"
  slides-per-view="1"
  navigation="true"
  pagination="true"
  loop="true"
  speed="800"
>
  @for (slide of slides; track slide.title) {
    <swiper-slide>
      <div class="slide">
        <img [src]="slide.imageUrl" [alt]="slide.title | translate" />

        <div class="slide-overlay">
          <h1>{{ slide.title | translate }}</h1>
          <p>{{ slide.subtitle | translate }}</p>

          @if (slide.buttonText) {
            <a [routerLink]="slide.buttonLink" class="hero-button">
              {{ slide.buttonText | translate }}
            </a>
          }
        </div>
      </div>
    </swiper-slide>
  }
</swiper-container>
