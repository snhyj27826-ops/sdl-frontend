@if (images.length) {
  <lg-gallery
    class="image-gallery"
    [attr.aria-label]="label"
    [features]="features"
    [licenseKey]="licenseKey"
  >
    @for (image of images; track image.src) {
      <a class="gallery-image" [href]="image.src" [lgGalleryItem]="image">
        <img [src]="image.thumb" [alt]="image.alt" />
        @if (image.caption) {
          <span class="gallery-caption">{{ image.caption }}</span>
        }
      </a>
    }
  </lg-gallery>
}
