<div class="org-container">
  <div class="org-header">
    <div class="badge">{{ 'ORGANIZATION_TITLE' | translate }}</div>
    <p class="org-subtitle">{{ 'ORGANIZATION_SUBTITLE' | translate }}</p>
  </div>

  <!-- Team Grid -->
  <div class="team-grid">
    @for (member of teamMembers(); track member._id) {
      <div class="team-card">
        <div class="member-image-wrapper">
          <img
            [src]="
            member.photo
              ? env.backendUrl + member.photo
              : 'assets/images/organization/default-member.webp'
          "
            [alt]="member.fullName"
            class="member-image"
          />
        </div>

        <div class="member-info">
          <h3 class="member-name">{{ member.fullName }}</h3>
          <p class="member-role">{{ member.role }}</p>
        </div>
      </div>
    } @empty {
      <p>No organization members found.</p>
    }
  </div>
</div>

<!-- CTA Join Us Section -->
<section class="join-cta-section">
  <div class="join-cta-content">
    <h2 class="cta-title">{{ 'JOIN_TEAM_TITLE' | translate }}</h2>
    <p class="cta-subtitle">{{ 'JOIN_TEAM_SUBTITLE' | translate }}</p>
    <button class="cta-btn" [routerLink]="'/apply'">
      {{ 'JOIN_BUTTON' | translate }}
    </button>
  </div>
</section>
